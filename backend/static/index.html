<style>

  .badge-terminated{background:#f3f4f6;color:#6b7280}
  .badge-resigned{background:#fef9c3;color:#854d0e}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #f1f5f9;padding:20px}
  .inp{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:14px;outline:none;box-sizing:border-box}

  .ok{background:#d1fae5;border:1px solid #a7f3d0;color:#065f46;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .er{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
  .lbl{display:block;font-size:13px;font-weight:500;color:#374151;margin-bottom:4px}
  select.inp option{color:#374151}

<script>
/* Cloudhubs HR Portal v20260423_071058 */
let tok='',role='',myEmpId='';
const $ = id=>document.getElementById(id);

function api(p,m,b){
  const o={method:m||'GET',headers:{'Content-Type':'application/json'}};
  if(tok)o.headers.Authorization='Bearer '+tok;
  if(b)o.body=JSON.stringify(b);
  return fetch(p,o).then(r=>{if(!r.ok)return r.json().then(e=>{throw e});return r.json()});
}

function alert2(id,msg,t='e'){
  const el=$(id); if(!el)return;
  el.innerHTML='<div class="'+(t==='s'?'ok':'er')+'">'+msg+'</div>';
  if(t==='s')setTimeout(()=>{el.innerHTML=''},3500);
}

function showModal(h){$('mbox').innerHTML=h;$('modal').style.display='flex';}
function closeModal(){$('modal').style.display='none';}
document.addEventListener('DOMContentLoaded',function(){ $('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeModal();}); });

async function doLogin(){
  const email=$('lEmail').value, pass=$('lPass').value;
  if(!email||!pass){alert2('loginErr','Please enter email and password');return;}
  try{
    const d=await api('/auth/login','POST',{email,password:pass});
    tok=d.access_token; role=d.role;
    $('pg_login').style.display='none';
    $('pg_app').style.display='flex';
    $('roleLabel').textContent=role+' Portal';
    $('userEmail').textContent=email;
    buildNav(); 
    role==='employee'?showEmpDash():showAdminDash();
  }catch(e){alert2('loginErr',e.detail||'Invalid email or password');}
}

function logout(){
  tok='';role='';myEmpId='';
  $('pg_app').style.display='none';
  $('pg_login').style.display='flex';
  $('lEmail').value='';$('lPass').value='';
}

function navBtn(lbl,fn){
  return `<button onclick="${fn}()" id="nb_${fn}" style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:13px;color:#93c5fd;cursor:pointer;background:none;border:none;width:100%;text-align:left;margin-bottom:2px" onmouseover="if(!this.classList.contains('nav-active'))this.style.background='rgba(255,255,255,.08)'" onmouseout="if(!this.classList.contains('nav-active'))this.style.background='none'">${lbl}</button>`;
}
function setActive(fn){
  document.querySelectorAll('#nav button').forEach(b=>{b.classList.remove('nav-active');b.style.background='none';b.style.color='#93c5fd';});
  const el=$('nb_'+fn); if(el){el.classList.add('nav-active');el.style.background='#2563eb';el.style.color='#fff';}
}

function buildNav(){
  const a=role==='admin', m=role==='manager', e=role==='employee';
  const n=(a||m)?[
    ['Admin Dashboard','showAdminDash'],
    ['ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¥ Employees','showEmployees'],
    ...(a?[['ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ Onboarding','showOnboard'],
    ['ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¯ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¸ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ Deleted Employees','showDeletedEmps'],['Create Admin','showCreateAdmin'],['Resignations','showResignations']]:[] ),
    ['Timesheets','showTimesheets'],
    ['Leave Requests','showLeaveReq'],
    ['Payroll','showPayroll'],
    ['Holidays & Leaves','showHolidaysLeaves'],
    ['Documents','showDocs'],
    ['Appraisals','showAppraisals'],
  ]:[
    ['My Dashboard','showEmpDash'],
    ['My Timesheets','showMyTimesheets'],
    ['Apply Leave','showApplyLeave'],
    ['Leave Balance','showLeaveBalance'],
    ['My Payslips','showPayslips'],
    ['Holidays & Leaves','showHolidaysLeaves'],
    ['Documents','showDocs'],
    ['My Profile','showProfile'],
    ['ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ My Training','showTraining'],
    ['ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂª Resign','showResign'],
  ];
  $('nav').innerHTML=n.map(([l,f])=>navBtn(l,f)).join('');
}

function setPage(h){$('content').innerHTML=h;}
function h1(t){return `<h1 style="font-size:22px;font-weight:700;color:#1e293b;margin:0 0 20px">${t}</h1>`;}
function sc(lbl,val,col,ic){return `<div class="card" style="display:flex;align-items:center;gap:16px;padding:16px"><div style="width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:${col}20">${ic}</div><div><div style="font-size:26px;font-weight:700;color:#1e293b">${val}</div><div style="font-size:12px;color:#64748b;margin-top:2px">${lbl}</div></div></div>`;}
function fld(id,lbl,type='text',req=false){return `<div><label class="lbl">${lbl}${req?' *':''}</label><input id="${id}" type="${type}" class="inp"${req?' required':''}></div>`;}
function tblWrap(head,body){return `<div class="card" style="padding:0;overflow:hidden"><table class="tbl" style="width:100%"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;}
function th(t){return `<th>${t}</th>`;}
function noRows(cols,msg='No data'){return `<tr><td colspan="${cols}" style="text-align:center;color:#94a3b8;padding:40px">${msg}</td></tr>`;}

// ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ ADMIN DASHBOARD ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ
async function showAdminDash(){
  setActive('showAdminDash');
  setPage(h1(role==='manager'?'Manager Dashboard':'Admin Dashboard')+'<p style="color:#94a3b8">Loading...</p>');
  try{
    const [s,lv]=await Promise.all([api('/dashboard/stats'),api('/leaves/all').catch(()=>[])]);
    const pl=Array.isArray(lv)?lv.filter(l=>l.status==='pending').length:0;
    setPage(h1(role==='manager'?'Manager Dashboard':'Admin Dashboard')+
      `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px">
        ${sc('Total Employees',s.total_employees,'#2563eb','ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¥')}
        ${sc('Pending Timesheets',s.pending_timesheets,'#f59e0b','ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ³')}
        ${sc('Approved Timesheets',s.approved_timesheets,'#10b981','ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ')}
        ${sc('Pending Leaves',pl,'#8b5cf6','ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ´')}</div>`+
      (s.upcoming_holidays?.length?`<div class="card"><h3 style="font-size:14px;font-weight:600;color:#374151;margin:0 0 12px">ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ Upcoming Holidays</h3>${s.upcoming_holidays.map(h=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px"><span style="font-weight:500">${h.name}</span><span style="color:#64748b">${h.date}</span></div>`).join('')}</div>`:'')+

// ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ EMPLOYEES ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ
async function showEmployees(){
  setActive('showEmployees');
  setPage('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px"><h1 style="font-size:22px;font-weight:700;color:#1e293b;margin:0">Employees</h1><button onclick="exportEmployeesCSV()" class="btn btn-n" style="font-size:13px">&#11015;&#65039; Export CSV</button></div>'+'<p style="color:#94a3b8">Loading...</p>');
  try{
    var emps = await api('/employees/');
    var rows = emps.map(function(e){
      return '<tr>' +
        '<td><div style="font-weight:500;color:#1e293b">'+e.first_name+' '+e.last_name+'</div><div style="font-size:12px;color:#94a3b8">'+e.email+'</div></td>' +
        '<td><button onclick="showEmpProfile('+e.id+')" style="font-family:monospace;font-size:12px;color:#2563eb;background:none;border:none;cursor:pointer;text-decoration:underline;padding:0" title="View full profile">'+e.employee_id+'</button></td>' +
        '<td>'+( e.designation||'-')+'</td>' +
        '<td>'+(e.department||'-')+'</td>' +
        '<td><span class="badge badge-'+(e.status||'active')+'">'+(e.status||'active')+'</span></td>' +
        '<td style="white-space:nowrap">' +
          '<button onclick="showEmpProfile('+e.id+')" class="btn btn-n" style="padding:3px 8px;font-size:11px;margin-right:3px;color:#7c3aed" title="View Profile">&#x1F194;</button>' +
          '<button onclick="doEditEmp('+e.id+')" class="btn btn-n" style="padding:3px 8px;font-size:11px;margin-right:3px;color:#2563eb">&#9999; Edit</button>' +
          '<button onclick="doResetPassword('+e.id+',\''+e.first_name+' '+e.last_name+'\')" class="btn btn-n" style="padding:3px 8px;font-size:11px;margin-right:3px;color:#d97706" title="Reset Password">&#x1F511;</button>' +
          '<button onclick="downloadEmploymentLetter('+e.id+',\''+e.employee_id+'\')" class="btn btn-n" style="padding:3px 8px;font-size:11px;margin-right:3px;color:#059669" title="Employment Letter">&#128196;</button>' +
          '<button onclick="doAssignMgrModal('+e.id+')" class="btn btn-n" style="padding:3px 8px;font-size:11px;margin-right:3px">Assign Mgr</button>' +
          '<button onclick="doTermModal('+e.id+',\''+e.first_name+' '+e.last_name+'\')" class="btn btn-d" style="padding:3px 8px;font-size:11px;margin-right:3px">Terminate</button>' +
          (role==='admin' ? '<button onclick="doDelEmp('+e.id+',\''+e.first_name+' '+e.last_name+'\')" class="btn btn-n" style="padding:3px 8px;font-size:11px;color:#dc2626">Delete</button>' : '') +
        '</td>' +
        '</tr>';
    }).join('');
    setPage(
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">' +
      '<h1 style="font-size:22px;font-weight:700;color:#1e293b;margin:0">Employees ('+emps.length+')</h1>' +

function doResetPassword(id, name) {
  showModal(
    '<h3 style="font-size:16px;font-weight:600;margin:0 0 4px">Reset Password</h3>' +
    '<p style="font-size:13px;color:#64748b;margin:0 0 16px">Set new password for <strong>' + name + '</strong></p>' +
    '<div id="rpAlert"></div>' +
    '<div style="margin-bottom:12px">' +
      '<label class="lbl">New Password</label>' +
      '<div style="position:relative">' +
        '<input id="rp_pass" type="password" class="inp" placeholder="Min 6 characters" style="padding-right:40px">' +
        '<button onclick="togglePwd(\'rp_pass\',\'rp_eye\')" id="rp_eye" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px">ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ</button>' +
      '</div>' +
    '</div>' +
    '<div style="margin-bottom:16px">' +
      '<label class="lbl">Confirm Password</label>' +
      '<div style="position:relative">' +
        '<input id="rp_conf" type="password" class="inp" placeholder="Repeat password" style="padding-right:40px">' +
        '<button onclick="togglePwd(\'rp_conf\',\'rp_eye2\')" id="rp_eye2" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px">ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ</button>' +
      '</div>' +
    '</div>' +
    '<div style="display:flex;gap:8px">' +
      '<button onclick="confirmResetPassword(' + id + ')" class="btn btn-p">Reset Password</button>' +
      '<button onclick="closeModal()" class="btn btn-n">Cancel</button>' +
    '</div>'
  );
}

async function confirmResetPassword(id) {
  var p = document.getElementById('rp_pass').value;
  var c = document.getElementById('rp_conf').value;
  if (!p || p.length < 6) { alert2('rpAlert', 'Password must be at least 6 characters'); return; }
  if (p !== c) { alert2('rpAlert', 'Passwords do not match'); return; }
  try {
    var r = await api('/employees/' + id + '/reset-password', 'POST', { new_password: p });
    alert2('rpAlert', r.message || 'Password reset!', 's');
    setTimeout(closeModal, 1500);

async function exportEmployeesCSV() {
  try {
    var emps = await api('/employees/');
    var headers = ['Employee ID','First Name','Last Name','Email','Phone','Designation',
      'Department','Employment Type','Status','Date of Joining','Date of Birth',
      'Address','Bank Account','Bank Name','IFSC Code','PF Number','UAN Number'];
    var rows = emps.map(function(e) {
      return [
        e.employee_id, e.first_name, e.last_name, e.email, e.phone || '',
        e.designation || '', e.department || '', e.employment_type, e.status || 'active',
        e.date_of_joining || '', e.date_of_birth || '', (e.address || '').replace(/,/g,' '),
        e.bank_account || '', e.bank_name || '', e.ifsc_code || '',
        e.pf_number || '', e.uan_number || ''
      ].map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
    });
    var csv = [headers.map(function(h){return '"'+h+'"';}).join(',')].concat(rows).join('\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'CloudHub_Employees_' + new Date().toISOString().split('T')[0] + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) { alert('Export failed: ' + (err.detail || 'Error')); }

async function downloadRelievingLetter(resignationId, empName) {
  try {
    var resp = await fetch('/employees/resignations/' + resignationId + '/letter', {
      headers: { 'Authorization': 'Bearer ' + tok }
    });
    if (!resp.ok) { alert('Failed to generate letter: ' + resp.status); return; }
    var blob = await resp.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Relieving_Letter_' + (empName || 'Employee').replace(/ /g,'_') + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  } catch(err) { alert('Error: ' + (err.message || 'Download failed')); }

async function downloadEmploymentLetter(empId, empCode) {
  try {
    var resp = await fetch('/employees/' + empId + '/letter/employment', {
      headers: { 'Authorization': 'Bearer ' + tok }
    });
    if (!resp.ok) { alert('Failed to generate letter: ' + resp.status); return; }
    var blob = await resp.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Employment_Letter_' + empCode + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  } catch(err) { alert('Error: ' + (err.message || 'Download failed')); }

async function showEmpProfile(id) {
  try {
    var e = await api('/employees/' + id);
    var rows = [
      ['Employee ID', e.employee_id], ['Full Name', e.first_name + ' ' + e.last_name],
      ['Email', e.email], ['Phone', e.phone || '-'],
      ['Designation', e.designation || '-'], ['Department', e.department || '-'],
      ['Employment Type', e.employment_type], ['Status', e.status || 'active'],
      ['Date of Joining', e.date_of_joining || '-'], ['Date of Birth', e.date_of_birth || '-'],
      ['Address', e.address || '-'], ['Bank Account', e.bank_account || '-'],
      ['Bank Name', e.bank_name || '-'], ['IFSC Code', e.ifsc_code || '-'],
      ['PF Number', e.pf_number || '-'], ['UAN Number', e.uan_number || '-']
    ];
    var initials = (e.first_name[0] || '') + (e.last_name[0] || '');
    var gridRows = rows.map(function(r) {
      return '<div style="padding:8px 0;border-bottom:1px solid #f1f5f9">' +
        '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px">' + r[0] + '</div>' +
        '<div style="font-size:13px;font-weight:500;color:#1e293b;margin-top:2px">' + r[1] + '</div>' +
        '</div>';
    }).join('');
    showModal(
      '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9">' +
        '<div style="width:56px;height:56px;background:#1e3a5f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;flex-shrink:0">' + initials + '</div>' +
        '<div>' +
          '<div style="font-size:18px;font-weight:700;color:#1e293b">' + e.first_name + ' ' + e.last_name + '</div>' +
          '<div style="font-size:12px;color:#64748b;margin-top:2px">' + (e.designation || 'Employee') + ' &bull; ' + (e.department || 'CloudHub') + '</div>' +
          '<div style="font-size:12px;font-family:monospace;color:#2563eb;margin-top:2px">' + e.employee_id + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="max-height:50vh;overflow-y:auto;padding-right:4px">' + gridRows + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:16px">' +
        '<button onclick="downloadEmploymentLetter(' + e.id + ',\'' + e.employee_id + '\')" class="btn btn-p" style="font-size:12px">ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ Employment Letter</button>' +
        '<button onclick="closeModal()" class="btn btn-n">Close</button>' +
      '</div>'
    );

async function doEditEmp(id) {
  try {
    var e = await api('/employees/' + id);
    var selOpt = function(val, opts) {
      return opts.map(function(o) {
        return '<option value="' + o + '"' + (val === o ? ' selected' : '') + '>' +
          o.charAt(0).toUpperCase() + o.slice(1) + '</option>';
      }).join('');
    };
    showModal(
      '<h3 style="font-size:16px;font-weight:600;margin:0 0 16px">Edit: ' + e.first_name + ' ' + e.last_name + '</h3>' +
      '<div id="editAlert"></div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:60vh;overflow-y:auto;padding-right:4px">' +
        '<div><label class="lbl">First Name</label><input id="ed_fn" class="inp" value="' + (e.first_name || '') + '"></div>' +
        '<div><label class="lbl">Last Name</label><input id="ed_ln" class="inp" value="' + (e.last_name || '') + '"></div>' +
        '<div><label class="lbl">Phone</label><input id="ed_ph" class="inp" value="' + (e.phone || '') + '"></div>' +
        '<div><label class="lbl">Designation</label><input id="ed_des" class="inp" value="' + (e.designation || '') + '"></div>' +
        '<div><label class="lbl">Department</label><input id="ed_dep" class="inp" value="' + (e.department || '') + '"></div>' +
        '<div><label class="lbl">Employment Type</label>' +
          '<select id="ed_et" class="inp">' + selOpt(e.employment_type, ['permanent','contractor','intern','consultant']) + '</select>' +
        '</div>' +
        '<div><label class="lbl">Date of Joining</label><input id="ed_doj" type="date" class="inp" value="' + (e.date_of_joining || '') + '"></div>' +
        '<div><label class="lbl">Date of Birth</label><input id="ed_dob" type="date" class="inp" value="' + (e.date_of_birth || '') + '"></div>' +
        '<div style="grid-column:span 2"><label class="lbl">Address</label><textarea id="ed_addr" class="inp" rows="2">' + (e.address || '') + '</textarea></div>' +
        '<div><label class="lbl">Bank Account</label><input id="ed_ba" class="inp" value="' + (e.bank_account || '') + '"></div>' +
        '<div><label class="lbl">Bank Name</label><input id="ed_bn" class="inp" value="' + (e.bank_name || '') + '"></div>' +
        '<div><label class="lbl">IFSC Code</label><input id="ed_ic" class="inp" value="' + (e.ifsc_code || '') + '"></div>' +
        '<div><label class="lbl">PF Number</label><input id="ed_pf" class="inp" value="' + (e.pf_number || '') + '"></div>' +
        '<div><label class="lbl">UAN Number</label><input id="ed_uan" class="inp" value="' + (e.uan_number || '') + '"></div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:16px">' +
        '<button onclick="saveEditEmp(' + e.id + ')" class="btn btn-p">Save Changes</button>' +
        '<button onclick="closeModal()" class="btn btn-n">Cancel</button>' +
      '</div>'
    );
  } catch (err) { alert('Failed to load: ' + (err.detail || 'Error')); }
}

async function saveEditEmp(id) {
  var data = {};
  var fm = [['ed_fn','first_name'],['ed_ln','last_name'],['ed_ph','phone'],['ed_des','designation'],
    ['ed_dep','department'],['ed_et','employment_type'],['ed_doj','date_of_joining'],
    ['ed_dob','date_of_birth'],['ed_addr','address'],['ed_ba','bank_account'],
    ['ed_bn','bank_name'],['ed_ic','ifsc_code'],['ed_pf','pf_number'],['ed_uan','uan_number']];
  fm.forEach(function(p) {
    var el = document.getElementById(p[0]);
    if (el && el.value !== '') data[p[1]] = el.value;
  });
  try {
    await api('/employees/' + id, 'PUT', data);
    alert2('editAlert', 'Employee updated successfully!', 's');
    setTimeout(function() { closeModal(); showEmployees(); }, 1200);

async function showDeletedEmps() {
  setActive('showDeletedEmps');
  setPage(h1('Deleted Employees') +
    '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#92400e">' +
    'Soft-deleted employees. Data is fully preserved. Click <strong>Reinstate</strong> to restore access.' +
    '</div><p style="color:#94a3b8">Loading...</p>');
  try {
    var emps = await api('/employees/inactive');
    if (!emps.length) {
      setPage(h1('Deleted Employees') +
        '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#92400e">' +
        'Soft-deleted employees. Data is fully preserved.</div>' +
        '<div class="card" style="text-align:center;padding:48px;color:#94a3b8"><div style="font-size:40px;margin-bottom:12px">ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ°ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¯ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¸ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ</div>' +
        '<div style="font-size:15px;font-weight:500">No deleted employees</div></div>');
      return;
    }
    var rows = emps.map(function(e) {
      return '<tr style="opacity:0.8">' +
        '<td><div style="font-weight:500">' + e.first_name + ' ' + e.last_name + '</div>' +
        '<div style="font-size:12px;color:#94a3b8">' + e.email + '</div></td>' +
        '<td style="font-family:monospace;font-size:12px;color:#64748b">' + e.employee_id + '</td>' +
        '<td style="color:#94a3b8">' + (e.designation || '-') + '</td>' +
        '<td style="color:#94a3b8">' + (e.department || '-') + '</td>' +
        '<td><span class="badge badge-' + (e.status || 'terminated') + '">' + (e.status || 'inactive') + '</span></td>' +
        '<td style="white-space:nowrap">' +
          '<button onclick="doReinstate(' + e.id + ',\'' + e.first_name + ' ' + e.last_name + '\')" class="btn btn-s" style="padding:3px 10px;font-size:12px;margin-right:4px">Reinstate</button>' +
        '</td>' +
        '</tr>';
    }).join('');
    setPage(h1('Deleted Employees (' + emps.length + ')') +
      '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:#92400e">' +
      'Click <strong>Reinstate</strong> to restore employee access.</div>' +
      tblWrap(['Employee','ID','Designation','Department','Status','Action'].map(th).join(''), rows));
  } catch (err) {
    setPage(h1('Deleted Employees') + '<p style="color:#ef4444">Failed: ' + (err.detail || 'Error') + '</p>');
  }
}

function doReinstate(id, name) {
  showModal(
    '<h3 style="font-size:16px;font-weight:600;margin:0 0 12px">Reinstate Employee</h3>' +
    '<p style="font-size:13px;color:#475569;margin:0 0 20px">Reinstate <strong>' + name + '</strong>? This restores their login and marks them active.</p>' +
    '<div id="reinstateAlert"></div>' +
    '<div style="display:flex;gap:8px">' +
      '<button onclick="confirmReinstate(' + id + ')" class="btn btn-s">Confirm Reinstate</button>' +
      '<button onclick="closeModal()" class="btn btn-n">Cancel</button>' +
    '</div>'
  );
}

async function confirmReinstate(id) {
  try {
    var r = await api('/employees/' + id + '/reinstate', 'POST');
    alert2('reinstateAlert', r.message || 'Reinstated!', 's');
    setTimeout(function() { closeModal(); showDeletedEmps(); }, 1200);

window.downloadPayslip = async function(recordId, label) {
  try {
    var resp = await fetch('/payroll/slip/' + recordId, {
      headers: { 'Authorization': 'Bearer ' + tok }
    });
    if (!resp.ok) {
      var err = await resp.json().catch(function(){ return {}; });
      alert('Failed to download payslip: ' + (err.detail || resp.status));
      return;
    }
    var blob = await resp.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Payslip_' + label + '.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  } catch(err) { alert('Download error: ' + (err.message || 'Unknown error')); }
}

window.getTrainingStatus = function() {
  var stored = localStorage.getItem('training_status_' + (window._empEmail || 'default'));
  return stored ? JSON.parse(stored) : {};
}

window.saveTrainingStatus = function(status) {
  localStorage.setItem('training_status_' + (window._empEmail || 'default'), JSON.stringify(status));
}

window.markTraining = function(id, completed) {
  var status = getTrainingStatus();
  if (completed) {
    status[id] = { completed: true, date: new Date().toLocaleDateString('en-IN') };
  } else {
    delete status[id];
  }
  saveTrainingStatus(status);
  showTraining();
}

        '<div style="text-align:center;padding:10px;background:#fee2e2;border-radius:8px"><div style="font-size:22px;font-weight:700;color:#dc2626">' + (total-done) + '</div><div style="font-size:11px;color:#991b1b">Pending</div></div>' +
        '<div style="text-align:center;padding:10px;background:#fef3c7;border-radius:8px"><div style="font-size:22px;font-weight:700;color:#92400e">' + TRAININGS.filter(function(t){return t.mandatory && !(status[t.id]&&status[t.id].completed);}).length + '</div><div style="font-size:11px;color:#92400e">Mandatory Pending</div></div>' +
      '</div>' +
    '</div>' +
    rows
  );
}

async function addMiscDeduction() {
  const emp_id = document.getElementById('miscEmpId').value;
  const label = document.getElementById('miscLabel').value.trim();
  const amount = parseFloat(document.getElementById('miscAmount').value);
  const month = parseInt(document.getElementById('miscMonth').value);
  const year = parseInt(document.getElementById('miscYear').value);
  const remarks = document.getElementById('miscRemarks').value.trim();
  if (!emp_id || !label || !amount || !month || !year) { alert('Please fill all required fields'); return; }
  const res = await fetch('/misc-deductions/', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
    body: JSON.stringify({ employee_id: parseInt(emp_id), label, amount, month, year, remarks: remarks || null })
  });
  if (res.ok) { alert('Deduction added successfully!'); loadMiscDeductions(); }
  else { const e = await res.json(); alert('Error: ' + (e.detail || 'Unknown error')); }
}

async function loadMiscDeductions() {
  const emp_id = document.getElementById('miscViewEmpId').value;
  if (!emp_id) { alert('Please select an employee'); return; }
  const res = await fetch('/misc-deductions/' + emp_id, {
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
  });
  if (!res.ok) { alert('Failed to load deductions'); return; }
  const data = await res.json();
  const container = document.getElementById('miscDeductionsList');
  if (!data.length) { container.innerHTML = '<p style="color:#666">No miscellaneous deductions found.</p>'; return; }
  const role = localStorage.getItem('role');
  container.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:13px">' +
    '<thead><tr style="background:#f1f5f9"><th style="padding:8px;text-align:left">Label</th><th>Amount</th><th>Month/Year</th><th>Remarks</th>' + (role==='admin'?'<th>Action</th>':'') + '</tr></thead>' +
    '<tbody>' + data.map(d => '<tr style="border-bottom:1px solid #e2e8f0">' +
      '<td style="padding:8px">' + d.label + '</td>' +
      '<td style="padding:8px;text-align:center">ÃÂÃÂÃÂÃÂ¢ÃÂÃÂÃÂÃÂÃÂÃÂÃÂÃÂ¹' + d.amount.toLocaleString() + '</td>' +
      '<td style="padding:8px;text-align:center">' + d.month + '/' + d.year + '</td>' +
      '<td style="padding:8px">' + (d.remarks || '-') + '</td>' +
      (role==='admin' ? '<td style="padding:8px;text-align:center"><button onclick="deleteMiscDeduction(' + d.id + ')" style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px">Delete</button></td>' : '') +
      '</tr>').join('') + '</tbody></table>';
}

async function deleteMiscDeduction(id) {
  if (!confirm('Delete this deduction?')) return;
  const res = await fetch('/misc-deductions/' + id, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
  });
  if (res.ok) { alert('Deleted!'); document.getElementById('miscViewEmpId').dispatchEvent(new Event('change')); loadMiscDeductions(); }
  else { alert('Failed to delete'); }
}

async function populateMiscEmpDropdowns() {
  const token = localStorage.getItem('token');
  const res = await fetch('/employees/', { headers: { 'Authorization': 'Bearer ' + token } });
  if (!res.ok) return;
  const emps = await res.json();
  const opts = emps.map(e => '<option value="' + e.id + '">' + e.first_name + ' ' + e.last_name + '</option>').join('');
  ['miscEmpId','miscViewEmpId'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<option value="">Select Employee</option>' + opts;
  });
}

let _currentAppraisalId=null;window._appraisalData=[];
async function populateAppraisalEmpDropdown(){const t=localStorage.getItem("token");const r=await fetch("/employees/",{headers:{"Authorization":"Bearer "+t}});if(!r.ok)return;const e=await r.json();const el=document.getElementById("appraisalEmpId");if(el)el.innerHTML="<option value=>Select Employee</option>"+e.map(x=>"<option value="+x.id+">"+x.first_name+" "+x.last_name+"</option>").join("");}
async function loadAppraisals(){const t=localStorage.getItem("token");const r=await fetch("/appraisals/",{headers:{"Authorization":"Bearer "+t}});if(!r.ok)return;const data=await r.json();window._appraisalData=data;const role=localStorage.getItem("role");const c=document.getElementById("appraisalList");if(!data.length){c.innerHTML="<p>No appraisals found.</p>";return;}const sC={draft:"#92400e",in_review:"#1e40af",completed:"#065f46"};const sB={draft:"#fef3c7",in_review:"#dbeafe",completed:"#d1fae5"};c.innerHTML="<table style=width:100%;border-collapse:collapse;font-size:13px><thead><tr style=background:#f1f5f9><th style=padding:8px>Emp</th><th>Period</th><th>Status</th><th>Rating</th><th>Action</th></tr></thead><tbody>"+data.map(function(a){const bg=sB[a.status]||"#f1f5f9";const col=sC[a.status]||"#374151";const del=role==="admin"?" <button onclick=deleteAppraisal("+a.id+") style=background:#ef4444;color:#fff;border:none;border-radius:4px;padding:2px 6px;cursor:pointer>Del</button>":"";return "<tr><td style=padding:6px>"+a.employee_id+"</td><td style=padding:6px;text-align:center>"+a.period+"</td><td style=padding:6px;text-align:center><span style=background:"+bg+";color:"+col+";padding:2px 6px;border-radius:4px;font-size:11px>"+a.status+"</span></td><td style=padding:6px;text-align:center>"+(a.overall_rating?"&#9733;"+a.overall_rating:"-")+"</td><td style=padding:6px><button class=btn-p onclick=openAppraisal("+a.id+") style=font-size:12px;padding:3px 8px>View</button>"+del+"</td></tr>";}).join("")+"</tbody></table>";}
function openAppraisal(id){const a=window._appraisalData.find(x=>x.id===id)||{};_currentAppraisalId=id;const list=document.getElementById("appraisalList");const det=document.getElementById("appraisalDetail");if(list)list.style.display="none";if(det)det.style.display="block";const t=document.getElementById("appraisalDetailTitle");if(t)t.textContent="Appraisal: "+(a.period||id);const st=document.getElementById("appraisalStatus");if(st)st.value=a.status||"draft";const role=localStorage.getItem("role");const gf=document.getElementById("goalsAdminForm");if(gf)gf.style.display=(role==="admin"||role==="manager")?"block":"none";const up=document.getElementById("appraisalUpdatePanel");if(up)up.style.display=(role==="admin"||role==="manager")?"block":"none";loadGoals(id);loadFeedback(id);}
async function createAppraisal(){const eid=parseInt(document.getElementById("appraisalEmpId").value);const per=document.getElementById("appraisalPeriod").value.trim();const rid=document.getElementById("appraisalReviewerId").value;const com=document.getElementById("appraisalComments").value.trim();if(!eid||!per){alert("Employee and period are required");return;}const body={employee_id:eid,period:per,comments:com||null};if(rid)body.reviewer_id=parseInt(rid);const res=await fetch("/appraisals/",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+localStorage.getItem("token")},body:JSON.stringify(body)});if(res.ok){alert("Appraisal created!");loadAppraisals();}else{const e=await res.json();alert("Error: "+(e.detail||"Failed"));}}
async function deleteAppraisal(id){if(!confirm("Delete?"))return;const res=await fetch("/appraisals/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+localStorage.getItem("token")}});if(res.ok)loadAppraisals();else alert("Failed");}
async function updateAppraisal(){const st=document.getElementById("appraisalStatus").value;const rt=document.getElementById("appraisalOverallRating").value;const body={status:st};if(rt)body.overall_rating=parseFloat(rt);const res=await fetch("/appraisals/"+_currentAppraisalId,{method:"PUT",headers:{"Content-Type":"application/json","Authorization":"Bearer "+localStorage.getItem("token")},body:JSON.stringify(body)});if(res.ok){alert("Updated!");loadAppraisals();}else alert("Failed");}
async function loadGoals(id){const res=await fetch("/appraisals/"+id+"/goals",{headers:{"Authorization":"Bearer "+localStorage.getItem("token")}});if(!res.ok)return;const goals=await res.json();const role=localStorage.getItem("role");const c=document.getElementById("goalsList");if(!goals.length){c.innerHTML="<p style=color:#999;font-size:12px>No goals yet.</p>";return;}c.innerHTML=goals.map(function(g){const del=(role==="admin"||role==="manager")?"<button onclick=deleteGoal("+g.id+") style=background:#ef4444;color:#fff;border:none;border-radius:4px;padding:2px 6px;cursor:pointer;font-size:11px>Delete</button>":"";return "<div style=border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px><b>"+g.title+"</b>"+(g.target?" - "+g.target:"")+(g.rating?" &#9733;"+g.rating:"")+del+"</div>";}).join("");}
async function addGoal(){const t=document.getElementById("goalTitle").value.trim();const tg=document.getElementById("goalTarget").value.trim();const rt=document.getElementById("goalRating").value;if(!t){alert("Title required");return;}const res=await fetch("/appraisals/"+_currentAppraisalId+"/goals",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+localStorage.getItem("token")},body:JSON.stringify({title:t,target:tg||null,rating:rt?parseFloat(rt):null})});if(res.ok){document.getElementById("goalTitle").value="";document.getElementById("goalTarget").value="";document.getElementById("goalRating").value="";loadGoals(_currentAppraisalId);}else alert("Failed");}
async function deleteGoal(id){if(!confirm("Delete goal?"))return;const res=await fetch("/appraisals/goals/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+localStorage.getItem("token")}});if(res.ok)loadGoals(_currentAppraisalId);else alert("Failed");}
async function loadFeedback(id){const res=await fetch("/appraisals/"+id+"/feedback",{headers:{"Authorization":"Bearer "+localStorage.getItem("token")}});if(!res.ok)return;const items=await res.json();const c=document.getElementById("feedbackList");if(!items.length){c.innerHTML="<p style=color:#999;font-size:12px>No feedback yet.</p>";return;}c.innerHTML=items.map(function(f){return "<div style=border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px>"+(f.strengths?"<b>Strengths:</b> "+f.strengths+"<br>":"")+(f.improvements?"<b>Improvements:</b> "+f.improvements+"<br>":"")+(f.rating?"&#9733;"+f.rating:"")+"</div>";}).join("");}
async function addFeedback(){const s=document.getElementById("feedbackStrengths").value.trim();const im=document.getElementById("feedbackImprovements").value.trim();const rt=document.getElementById("feedbackRating").value;const res=await fetch("/appraisals/"+_currentAppraisalId+"/feedback",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+localStorage.getItem("token")},body:JSON.stringify({strengths:s||null,improvements:im||null,overall_comment:null,rating:rt?parseFloat(rt):null})});if(res.ok){document.getElementById("feedbackStrengths").value="";document.getElementById("feedbackImprovements").value="";document.getElementById("feedbackRating").value="";loadFeedback(_currentAppraisalId);}else alert("Failed");}

async function addMiscDeductionFromPayroll(){
  const empId=document.getElementById('scEmp')?document.getElementById('scEmp').value:'';
  const label=document.getElementById('miscLabel').value.trim();
  const amount=parseFloat(document.getElementById('miscAmount').value);
  const month=parseInt(document.getElementById('miscMonth').value);
  const year=parseInt(document.getElementById('miscYear').value);
  const remarks=document.getElementById('miscRemarks').value.trim();
  if(!empId){alert('Please select an employee first');return;}
  if(!label||!amount||!month||!year){alert('Label, amount, month and year are required');return;}
  try{
    await api('/misc-deductions/','POST',{employee_id:parseInt(empId),label,amount,month,year,remarks:remarks||null});
    alert('Deduction added successfully!');
    document.getElementById('miscLabel').value='';
    document.getElementById('miscAmount').value='';
    document.getElementById('miscMonth').value='';
    document.getElementById('miscRemarks').value='';
    loadMiscDeductionsForEmp(empId);
  }catch(e){alert('Failed: '+(e.message||e));}
}

async function loadMiscDeductionsForEmp(empId){
  const container=document.getElementById('miscDeductionsList');
  if(!container)return;
  try{
    const data=await api('/misc-deductions/'+empId);
    const role=localStorage.getItem('role');
    if(!data.length){container.innerHTML='<p style="color:#94a3b8;font-size:13px">No miscellaneous deductions for this employee.</p>';return;}
    container.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="background:#f1f5f9"><th style="padding:6px;text-align:left">Label</th><th style="padding:6px;text-align:right">Amount</th><th style="padding:6px;text-align:center">Month/Year</th><th style="padding:6px">Remarks</th>'+(role==='admin'?'<th style="padding:6px;text-align:center">Action</th>':'')+'</tr></thead><tbody>'+
    data.map(d=>'<tr style="border-bottom:1px solid #e2e8f0"><td style="padding:6px">'+d.label+'</td><td style="padding:6px;text-align:right">Rs.'+d.amount.toLocaleString()+'</td><td style="padding:6px;text-align:center">'+d.month+'/'+d.year+'</td><td style="padding:6px">'+(d.remarks||'-')+'</td>'+(role==='admin'?'<td style="padding:6px;text-align:center"><button onclick="deleteMiscDeductionFromPayroll('+d.id+','+empId+')" style="background:#ef4444;color:#fff;border:none;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:12px">Delete</button></td>':'')+'</tr>').join('')+
    '</tbody></table>';
  }catch(e){container.innerHTML='<p style="color:#ef4444;font-size:13px">Failed to load deductions.</p>';}
}

async function deleteMiscDeductionFromPayroll(id,empId){
  if(!confirm('Delete this deduction?'))return;
  try{
    await api('/misc-deductions/'+id,'DELETE');
    loadMiscDeductionsForEmp(empId);
  }catch(e){alert('Failed to delete');}
}
